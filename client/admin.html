<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Archivo:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/css/styles.css">
<link rel="shortcut icon" href="public/assets/glass.png" type="image/png">

</head>
<body>


<div id="toast" class="toast"></div>

<header>
  <h1 id="home-link">
    <span class="logo-line">Dalgards <img src="public/assets/glass.png" alt="" class="logo-glass"> Drinkar</span>
    <span class="logo-sub">Admin</span>
  </h1>
</header>

<div class="admin-wrap" id="admin-wrap">

  <div class="filter-group" id="key-section">
    <input type="password" id="admin-key-input" placeholder="Lösenord">
    <button type="button" class="filter-toggle" id="key-save">Logga in</button>
  </div>

  <div id="admin-panel" style="display:none;">
    <nav class="admin-navigation" aria-label="Välj adminvy">
      <button type="button" class="admin-nav-button" data-admin-mode="add" aria-pressed="true" aria-controls="admin-drinks-view">Lägg till drink</button>
      <button type="button" class="admin-nav-button" data-admin-mode="edit" aria-pressed="false" aria-controls="admin-drinks-view">Redigera en drink</button>
      <button type="button" class="admin-nav-button" data-admin-mode="filters" aria-pressed="false" aria-controls="admin-filters-view">Redigera filter</button>
    </nav>

    <section id="admin-drinks-view" aria-label="Hantera drinkar">

    <div class="filter-group" id="edit-picker-group" style="display:none;">
      <label for="edit-search">Sök drink att redigera</label>
      <div class="search-wrapper edit-search-wrap" id="edit-search-wrap">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="edit-search" placeholder="Sök efter drink …" autocomplete="off">
        <div class="edit-search-results" id="edit-search-results"></div>
      </div>
    </div>

    <form id="drink-form">
      <div class="filter-group">
        <label for="f-date" class="required-label">Datum</label>
        <input type="text" id="f-date" placeholder="ÅÅÅÅ-MM-DD" required>
      </div>
      <div class="filter-group">
        <label for="f-drink" class="required-label">Drinknamn</label>
        <input type="text" id="f-drink" required>
      </div>
      <div class="filter-group">
        <label for="f-theme">Tema</label>
        <input type="text" id="f-theme">
      </div>
      <div class="filter-group full-width">
        <label for="f-note">Kommentar</label>
        <input type="text" id="f-note">
      </div>
      <fieldset class="admin-recipe-fields full-width">
        <legend>Ingredienser</legend>
        <div id="f-ingredients" class="admin-recipe-rows"></div>
        <button type="button" id="add-ingredients" class="admin-recipe-add">+ Lägg till ingrediens</button>
      </fieldset>
      <fieldset class="admin-recipe-fields full-width">
        <legend>Gör såhär</legend>
        <div id="f-steps" class="admin-recipe-rows"></div>
        <button type="button" id="add-steps" class="admin-recipe-add">+ Lägg till steg</button>
      </fieldset>
      <div class="filter-group">
        <label for="f-taste">Smakprofil (t.ex. 2/5, 3/5, 1/5, 2/5, 0/5)</label>
        <input type="text" id="f-taste">
      </div>

        <div class="filter-group">
        <label class="required-label">Video</label>
        <div class="file-input-wrap">
            <label for="f-video-file" class="file-button">Välj fil</label>
            <span class="file-name" id="f-video-filename">Ingen fil vald</span>
        </div>
        <input type="file" id="f-video-file" accept="video/*" class="file-input-hidden">
        </div>

        <div class="filter-group">
        <label class="required-label">Poster-bild</label>
        <div class="file-input-wrap">
            <label for="f-photo-file" class="file-button">Välj fil</label>
            <span class="file-name" id="f-photo-filename">Ingen fil vald</span>
        </div>
        <input type="file" id="f-photo-file" accept="image/*" class="file-input-hidden">
        </div>

      <input type="hidden" id="f-video-url">
      <input type="hidden" id="f-photo-url">
      <input type="hidden" id="f-id">

      <button type="submit" class="filter-toggle" id="submit-btn" disabled>
        Lägg till drink
      </button>

      <button type="submit" class="filter-toggle" id="edit-submit-btn" disabled style="display:none;">
        Spara ändringar
      </button>

      <button type="button" class="filter-clear" id="delete-btn" style="display:none;">
        Ta bort denna drink
      </button>
      <button type="button" class="filter-toggle" id="preview-btn" disabled>Förhandsgranska</button>

    </form>

    </section>

    <section id="admin-filters-view" class="admin-spirits" aria-labelledby="admin-filters-title" hidden>
      <h2 id="admin-filters-title">Spritsorter</h2>
      <p>Här ändrar du spritfiltren och vilka ord i ingredienserna som matchar dem. Ta med spritsortens namn som sökord om även det ska matcha. Versaler spelar ingen roll.</p>
      <form id="spirits-form">
        <fieldset id="spirits-fields" aria-label="Redigera spritsorter" disabled>
          <div id="spirits-rows" class="admin-spirits-rows"></div>
          <button type="button" id="spirits-add" class="admin-recipe-add">+ Lägg till spritsort</button>
          <div class="admin-spirits-actions">
            <button type="submit" id="spirits-save" class="filter-toggle" disabled>Spara spritsorter</button>
            <button type="button" id="spirits-discard" class="filter-clear" disabled>Ångra ändringar</button>
          </div>
        </fieldset>
      </form>
      <p id="spirits-status" role="status" aria-live="polite"></p>
      <button type="button" id="spirits-retry" class="filter-toggle" hidden>Försök igen</button>
    </section>

    <div id="status-msg" class="upload-status">
      <span class="spinner"></span>
      <span id="status-text"></span>
    </div>
  </div>
</div>

<dialog class="modal-backdrop admin-preview" id="modal-backdrop" aria-labelledby="modal-drink">
  <div class="modal">
    <button type="button" class="modal-close" id="modal-close" aria-label="Stäng förhandsgranskning">×</button>
    <div class="modal-scroll">
      <div class="modal-media"><video id="modal-video" controls playsinline preload="metadata"></video></div>
      <div class="modal-info">
        <p class="preview-kicker">Förhandsgranskning · Inte sparad</p>
        <h2 id="modal-drink"></h2>
        <div class="tag-row">
          <button type="button" class="theme-tag" id="modal-theme" disabled></button>
          <span class="date" id="modal-date"></span>
        </div>
        <p class="note" id="modal-note"></p>
        <div class="recipe-block" id="recipe-block" style="display:none;">
          <div id="recipe-groups"></div>
        </div>
        <div class="taste-profile" id="taste-profile" style="display:none;">
          <p class="recipe-heading">Smakprofil</p>
          <div class="taste-rows" id="taste-rows"></div>
        </div>
        <section id="recipe-spirit-links" class="recipe-spirit-links" aria-label="Fler drinkar med samma spritsort" hidden></section>
      </div>
    </div>
  </div>
</dialog>

<script src="public/js/config.js"></script>
<script src="public/js/admin-recipe-fields.js"></script>
<script type="module" src="public/js/admin.js"></script>
</body>
</html>
