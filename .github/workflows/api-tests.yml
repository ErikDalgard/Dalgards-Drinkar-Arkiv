name: CI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check API types
        run: npx tsc --noEmit
      - name: Check test types
        run: npx tsc --noEmit -p test/tsconfig.json
      - name: Run API tests
        run: npm run test:run

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    # Keep this version aligned with @playwright/test in client/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend logic tests
        run: npm test
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Upload browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-test-results
          path: client/test-results/
          retention-days: 7
