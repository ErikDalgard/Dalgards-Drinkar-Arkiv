<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkivet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Archivo:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
<link rel="icon" href="/glass.png" type="image/png">
<link rel="shortcut icon" href="/glass.png" type="image/png">
<script src="script.js"></script>


</head>
<body>

<header>
  <h1 id="home-link">
    <span class="logo-line">Dalgards <img src="glass.png" alt="" class="logo-glass"> Drinkar</span>
    <span class="logo-sub">Arkivet</span>
  </h1>
</header>
<div class="controls">
  <div class="search-wrapper">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="search" type="text" placeholder="Sök efter en drink…">
  </div>

  <button id="filter-toggle" class="filter-toggle" type="button">
    <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
    </svg>
    <span id="filter-toggle-text">Visa filter</span>
  </button>
</div>
<div class="filter-panel" id="filter-panel">
  <div class="filter-group">
    <label>Säsong</label>
    <button type="button" class="theme-picker-toggle" id="theme-picker-toggle">
      <span id="theme-picker-label">Alla säsonger</span>
    </button>
  </div>

<div class="filter-group">
  <label>Sprit</label>
  <div class="theme-picker">
    <button type="button" class="theme-picker-toggle" id="spirit-picker-toggle">
      <span id="spirit-picker-label">All sprit</span> ▾
    </button>
    <div class="theme-picker-panel" id="spirit-picker-panel">
      <div class="theme-chip-list" id="spirit-chip-list"></div>
    </div>
  </div>
</div>

  <div class="date-range">
    <div class="filter-group">
      <label for="date-from">Från datum</label>
      <input type="date" id="date-from">
    </div>
    <div class="filter-group">
      <label for="date-to">Till datum</label>
      <input type="date" id="date-to">
    </div>
  </div>

<div class="filter-actions">
  <button type="button" class="filter-clear" id="filter-clear">
    <svg class="clear-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
      <path d="M3 3v5h5"></path>
    </svg>
    <span>Rensa filter</span>
  </button>
</div>
</div>




<div class="menu">
  <p class="count" id="count"></p>
  <select class="sort-select" id="sort-order">
      <option value="desc">Nyast först</option>
      <option value="asc">Äldst först</option>
    </select>
</div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" style="display:none;">Inga videos matchar sökningen.</p>
<div class="pagination" id="pagination"></div>

<div class="theme-modal-backdrop" id="theme-modal-backdrop">
  <div class="theme-modal">
    
    <div class="theme-modal-header">
      <div>
        <p class="theme-modal-kicker">Filtrera arkivet</p>
        <h2>Välj säsong</h2>
      </div>

      <button type="button" class="theme-modal-close" id="theme-modal-close">
        ×
      </button>
    </div>

    <input
      type="text"
      id="theme-picker-search"
      placeholder="Sök säsong …"
      autocomplete="off"
    >

    <div class="theme-chip-list" id="theme-chip-list"></div>

  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-scroll">

    <video id="modal-video" controls playsinline></video>
    <div class="modal-info">
      <h2 id="modal-drink"></h2>
      <div class="tag-row">
        <span class="theme-tag" id="modal-theme"></span>
        <span class="date" id="modal-date"></span>
      </div>
      <p class="note" id="modal-note"></p>
      <div class="taste-profile" id="taste-profile" style="display:none;">
        <p class="recipe-heading">Smakprofil</p>
        <div class="taste-rows" id="taste-rows"></div>
      </div>
      <div class="recipe-block" id="recipe-block" style="display:none;">
        <p class="recipe-heading">Ingredienser</p>
        <ul class="recipe-ingredients" id="modal-ingredients"></ul>
        <p class="recipe-heading">Gör såhär</p>
        <ol class="recipe-steps" id="modal-steps"></ol>
      </div>      
      <div class="modal-actions">
        <button class="recipe-toggle" id="recipe-toggle" style="display:none;">Visa recept</button>
        <button class="modal-close" id="modal-close">Stäng</button>
      </div>
    </div>
        </div>

  </div>
</div>
<!-- Footer -->
<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-text">
      <p class="footer-credit">Av <strong>Dalgards Drinkar</strong>.</p>
      <p class="footer-contact">
        Har du idéer?
        <a href="https://www.instagram.com/dalgardsdrinkar/" target="_blank" rel="noopener">Skriv till oss</a>
      </p>
    </div>
    <img
      class="footer-glass"
      src="glass.png"
      alt="Dalgards Drinkars glas"
    >
  </div>
</footer>
</body>
</html>
