<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkivet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Archivo:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
<link rel="icon" href="/glass.png" type="image/png">
<link rel="shortcut icon" href="/glass.png" type="image/png">
<script src="script.js"></script>


</head>
<body>

<header>
  <h1 id="home-link">
    <span class="logo-line">Dalgards <img src="glass.png" alt="" class="logo-glass"> Drinkar</span>
    <span class="logo-sub">Arkivet</span>
  </h1>
</header>
<div class="controls">
  <input id="search" type="text" placeholder="Sök efter en drink…">
  <button id="filter-toggle" class="filter-toggle">Visa filter</button>
</div>
<div class="filter-panel" id="filter-panel">
<div class="filter-group">
  <label>Tema</label>
  <button type="button" class="theme-picker-toggle" id="theme-picker-toggle">
    <span id="theme-picker-label">Alla teman</span>
  </button>
</div>
<div class="filter-group">
  <label for="date-from">Från datum</label>
  <input type="date" id="date-from">
</div>
<div class="filter-group">
  <label for="date-to">Till datum</label>
  <input type="date" id="date-to">
</div>
<button class="filter-clear" id="filter-clear">Rensa filter</button>
</div>


<div class="menu">
  <p class="count" id="count"></p>
  <select class="sort-select" id="sort-order">
      <option value="desc">Nyast först</option>
      <option value="asc">Äldst först</option>
    </select>
</div>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" style="display:none;">Inga videos matchar sökningen.</p>
<div class="pagination" id="pagination"></div>

<div class="theme-modal-backdrop" id="theme-modal-backdrop">
  <div class="theme-modal">
    
    <div class="theme-modal-header">
      <div>
        <p class="theme-modal-kicker">Filtrera arkivet</p>
        <h2>Välj tema</h2>
      </div>

      <button type="button" class="theme-modal-close" id="theme-modal-close">
        ×
      </button>
    </div>

    <input
      type="text"
      id="theme-picker-search"
      placeholder="Sök tema …"
      autocomplete="off"
    >

    <div class="theme-chip-list" id="theme-chip-list"></div>

  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-scroll">

    <video id="modal-video" controls playsinline></video>
    <div class="modal-info">
      <h2 id="modal-drink"></h2>
      <div class="tag-row">
        <span class="theme-tag" id="modal-theme"></span>
        <span class="date" id="modal-date"></span>
      </div>
      <p class="note" id="modal-note"></p>
      <div class="taste-profile" id="taste-profile" style="display:none;">
        <p class="recipe-heading">Smakprofil</p>
        <div class="taste-rows" id="taste-rows"></div>
      </div>
      <div class="recipe-block" id="recipe-block" style="display:none;">
        <p class="recipe-heading">Ingredienser</p>
        <ul class="recipe-ingredients" id="modal-ingredients"></ul>
        <p class="recipe-heading">Gör såhär</p>
        <ol class="recipe-steps" id="modal-steps"></ol>
      </div>      
      <div class="modal-actions">
        <button class="recipe-toggle" id="recipe-toggle" style="display:none;">Visa recept</button>
        <button class="modal-close" id="modal-close">Stäng</button>
      </div>
    </div>
        </div>

  </div>
</div>
</body>
</html>
